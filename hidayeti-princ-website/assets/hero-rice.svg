      <ellipse cx="88" cy="53" rx="14" ry="4" transform="rotate(13 88 53)"/><ellipse cx="128" cy="48" rx="14" ry="4" transform="rotate(-17 128 48)"/><ellipse cx="171" cy="52" rx="13" ry="4" transform="rotate(20 171 52)"/><ellipse cx="200" cy="51" rx="12" ry="4" transform="rotate(-15 200 51)"/>
