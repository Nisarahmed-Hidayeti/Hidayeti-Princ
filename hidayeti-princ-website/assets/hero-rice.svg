<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 730" role="img" aria-labelledby="title desc">
  <title id="title">Hidayeti Prinç Basmati product illustration</title>
  <desc id="desc">A warm ivory rice bag, a ceramic bowl of golden rice, and a delicate rice stalk on a soft neutral background. Placeholder art for the website.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f1e6"/><stop offset="1" stop-color="#e8ddc5"/></linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf6"/><stop offset=".53" stop-color="#f3ead7"/><stop offset="1" stop-color="#dfd1b7"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e6c979"/><stop offset="1" stop-color="#ae8438"/></linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#cfc2a8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="860" height="730" rx="40" fill="url(#bg)"/>
  <circle cx="584" cy="280" r="205" fill="#d9c69d" opacity=".25"/>
  <circle cx="180" cy="175" r="100" fill="#fffaf0" opacity=".55"/>
  <ellipse cx="440" cy="626" rx="260" ry="35" fill="#7e6848" opacity=".17" filter="url(#shadow)"/>
