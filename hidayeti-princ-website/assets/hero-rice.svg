      <ellipse cx="-8" cy="61" rx="6" ry="14" transform="rotate(-30 -8 61)"/><ellipse cx="-20" cy="58" rx="6" ry="14" transform="rotate(-30 -20 58)"/><ellipse cx="71" cy="82" rx="6" ry="14" transform="rotate(30 71 82)"/><ellipse cx="84" cy="85" rx="6" ry="14" transform="rotate(30 84 85)"/>
      <ellipse cx="-12" cy="91" rx="6" ry="14" transform="rotate(-30 -12 91)"/><ellipse cx="-24" cy="88" rx="6" ry="14" transform="rotate(-30 -24 88)"/><ellipse cx="71" cy="115" rx="6" ry="14" transform="rotate(30 71 115)"/><ellipse cx="84" cy="118" rx="6" ry="14" transform="rotate(30 84 118)"/>
    </g>
