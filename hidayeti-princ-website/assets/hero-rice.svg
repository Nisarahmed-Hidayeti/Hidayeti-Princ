    <path d="M96 24h140l16 31H79Z" fill="#e9deca" stroke="#d8c9ac" stroke-width="1.5"/>
    <path d="M62 109q108 20 210 0" fill="none" stroke="#b49a67" stroke-opacity=".42" stroke-width="2"/>
    <rect x="82" y="132" width="156" height="208" rx="3" fill="#24382e"/>
    <rect x="91" y="141" width="138" height="190" rx="2" fill="none" stroke="#d8bc7c" stroke-opacity=".8"/>
    <text x="160" y="168" font-family="Georgia,serif" font-size="12" letter-spacing="3" text-anchor="middle" fill="#dfc489">HİDAYETİ</text>
    <text x="160" y="195" font-family="Georgia,serif" font-weight="bold" font-size="21" text-anchor="middle" fill="#fff8e8">PRİNÇ</text>
    <path d="M160 209v48M160 221q-22-1-24-17 20 1 24 17M161 232q22-1 24-17-20 1-24 17M160 244q-18-1-21-15 17 1 21 15M161 252q18-1 21-15-17 1-21 15" fill="none" stroke="#d8bc7c" stroke-width="2" stroke-linecap="round"/>
