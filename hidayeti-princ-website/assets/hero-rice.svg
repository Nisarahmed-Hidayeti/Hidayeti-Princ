    <text x="160" y="372" font-family="Arial,sans-serif" font-weight="bold" font-size="12" text-anchor="middle" fill="#24382e">DEMO · 5 KG</text>
    <text x="160" y="409" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.4" text-anchor="middle" fill="#81745e">PLACEHOLDER</text>
    <path d="M75 449q80 15 169 0" fill="none" stroke="#c6b18b" stroke-width="1.5"/>
  </g>
