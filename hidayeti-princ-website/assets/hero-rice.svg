    <text x="160" y="294" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" text-anchor="middle" fill="#fff8e8">BASMATI</text>
    <text x="160" y="315" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle" fill="#e6d8b9">PİRİNÇ</text>
